name: Deploy Backend (GHCR + Traefik)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  IMAGE_NAME: tangyuling-api
  SSH_HOST: ssh.sinryuji.me
  SSH_USER: sinryuji
  SSH_PORT: "22"
  PUBLIC_DOMAIN: clean-be.sinryuji.me

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      ghcr_owner: ${{ steps.owner.outputs.ghcr_owner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: owner
        run: echo "ghcr_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.ghcr_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.ghcr_owner }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.ghcr_owner }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          tmp_key="$(mktemp)"
          if printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$tmp_key" 2>/dev/null && ssh-keygen -yf "$tmp_key" >/dev/null 2>&1; then
            mv "$tmp_key" ~/.ssh/deploy_key
          else
            rm -f "$tmp_key"
            printf '%b' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          ssh-keygen -yf ~/.ssh/deploy_key >/dev/null 2>&1 || (echo "Invalid SSH_PRIVATE_KEY format" && exit 1)
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ env.SSH_PORT }}" "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists on server
        run: |
          ssh -p "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" \
            "mkdir -p ~/tangyuling"

      - name: Copy docker-compose.prod.yml to server
        run: |
          scp -P "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            "${{ env.SSH_USER }}@${{ env.SSH_HOST }}:~/tangyuling/"

      - name: Copy .env.prod file to server
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env.prod
          scp -P "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key \
            .env.prod \
            "${{ env.SSH_USER }}@${{ env.SSH_HOST }}:~/tangyuling/"

      - name: Deploy to server
        run: |
          ssh -p "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" \
            GHCR_USER="${{ github.actor }}" \
            GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            GHCR_OWNER="${{ needs.build-and-push.outputs.ghcr_owner }}" \
            IMAGE_TAG="${{ github.sha }}" \
            PUBLIC_DOMAIN="${{ env.PUBLIC_DOMAIN }}" \
            'bash -s' << 'ENDSSH'
            set -euo pipefail
            cd ~/tangyuling
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export GHCR_OWNER IMAGE_TAG PUBLIC_DOMAIN
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull mysql api
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d mysql api
            docker image prune -af
            docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail=50 api
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -p "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" << 'ENDSSH'
            set -euo pipefail
            cd ~/tangyuling
            docker compose --env-file .env.prod -f docker-compose.prod.yml ps

            # Traefik 라우팅 반영 지연을 고려해 도메인 헬스체크를 잠시 재시도한다.
            ok=0
            for _ in $(seq 1 15); do
              if curl -kfsS "https://clean-be.sinryuji.me/health" >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done

            # 도메인 헬스체크가 실패하면 API 컨테이너 직접 헬스체크로 최종 확인한다.
            if [ "$ok" -ne 1 ]; then
              api_ip=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' tangyuling-api-prod)
              curl -fsS "http://${api_ip}:8000/health" >/dev/null
            fi
          ENDSSH

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f .env.prod
