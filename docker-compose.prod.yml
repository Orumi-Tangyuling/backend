services:
  mysql:
    image: mysql:8
    container_name: tangyuling-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tangyuling}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api:
    image: ghcr.io/${GHCR_OWNER:-sinryuji}/tangyuling-api:${IMAGE_TAG:-latest}
    container_name: tangyuling-api-prod
    expose:
      - "8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/${MYSQL_DATABASE:-tangyuling}
      - TANGYULING_MYSQL_HOST=mysql
      - TANGYULING_MYSQL_PORT=3306
      - TZ=Asia/Seoul
    env_file:
      - .env
    networks:
      - dev
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev
      - traefik.http.routers.tangyuling-api.rule=Host(`${PUBLIC_DOMAIN:-clean-be.sinryuji.me}`)
      - traefik.http.routers.tangyuling-api.entrypoints=websecure
      - traefik.http.routers.tangyuling-api.tls=true
      - traefik.http.routers.tangyuling-api.tls.certresolver=le
      - traefik.http.services.tangyuling-api.loadbalancer.server.port=8000
    restart: always
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  mysql_data:

networks:
  dev:
    external: true
    name: dev
