name: Deploy Backend (GHCR + Traefik)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  IMAGE_NAME: tangyuling-api
  SSH_HOST: ssh.sinryuji.me
  SSH_USER: sinryuji
  SSH_PORT: "22"
  PUBLIC_DOMAIN: clean-be.sinryuji.me

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      ghcr_owner: ${{ steps.owner.outputs.ghcr_owner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: owner
        run: echo "ghcr_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.ghcr_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.ghcr_owner }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.ghcr_owner }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ env.SSH_PORT }}" "${{ env.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists on server
        run: |
          ssh -p "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" \
            "mkdir -p ~/tangyuling"

      - name: Copy docker-compose.prod.yml to server
        run: |
          scp -P "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            "${{ env.SSH_USER }}@${{ env.SSH_HOST }}:~/tangyuling/"

      - name: Copy .env file to server
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          scp -P "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key \
            .env \
            "${{ env.SSH_USER }}@${{ env.SSH_HOST }}:~/tangyuling/"

      - name: Deploy to server
        run: |
          ssh -p "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" \
            GHCR_USER="${{ github.actor }}" \
            GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            GHCR_OWNER="${{ needs.build-and-push.outputs.ghcr_owner }}" \
            IMAGE_TAG="${{ github.sha }}" \
            PUBLIC_DOMAIN="${{ env.PUBLIC_DOMAIN }}" \
            'bash -s' << 'ENDSSH'
            set -euo pipefail
            cd ~/tangyuling
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export GHCR_OWNER IMAGE_TAG PUBLIC_DOMAIN
            docker compose -f docker-compose.prod.yml pull mysql api
            docker compose -f docker-compose.prod.yml up -d mysql api
            docker image prune -af
            docker compose -f docker-compose.prod.yml logs --tail=50 api
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -p "${{ env.SSH_PORT }}" -i ~/.ssh/deploy_key "${{ env.SSH_USER }}@${{ env.SSH_HOST }}" << 'ENDSSH'
            cd ~/tangyuling
            docker compose -f docker-compose.prod.yml ps
            curl -fsS "https://clean-be.sinryuji.me/health" >/dev/null
          ENDSSH

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f .env
